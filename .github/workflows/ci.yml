name: EasyMark CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  # 1. AI Service Python Unit & Integration Tests (161 Pytest Cases)
  ai-service-tests:
    name: AI Service Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install AI Service dependencies
        working-directory: ./ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Regression Suite (161 tests)
        working-directory: ./ai-service
        env:
          PYTHONPATH: .
          HF_HUB_OFFLINE: '1'
          INTERNAL_API_KEY: 'company_intel_internal_sec_token_2026_9f8e7d'
        run: |
          pytest tests -v --tb=short

  # 2. Node.js Express Gateway Verification
  backend-gateway-check:
    name: Express Gateway Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Gateway dependencies
        working-directory: ./backend
        run: npm ci

      - name: Check Gateway Server Syntax
        working-directory: ./backend
        run: node -c src/server.js

  # 3. React Frontend Production Build Verification
  frontend-build-check:
    name: Frontend Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Vite Production Bundle
        working-directory: ./frontend
        run: npm run build

  # 4. Multi-Container Docker Compose Validation
  docker-build-check:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    needs: [ai-service-tests, backend-gateway-check, frontend-build-check]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker Containers
        run: docker compose build --no-cache

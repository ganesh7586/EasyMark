version: '3.8'

services:
  # Python + FastAPI + LangGraph StateGraph + Vector RAG + MCP Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: easymark-ai-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-company_intel_internal_sec_token_2026_9f8e7d}
      - MONGO_URI=${MONGO_URI:-mongodb://localhost:27017}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-company_intelligence}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - EMBEDDING_MODEL_NAME=all-MiniLM-L6-v2
      - HF_HUB_OFFLINE=1
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - easymark-net

  # Node.js + Express Application Gateway & MCP Proxy
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: easymark-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - AI_SERVICE_URL=http://ai-service:8000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-company_intel_internal_sec_token_2026_9f8e7d}
      - NODE_ENV=production
    depends_on:
      ai-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - easymark-net

  # React 18 + Vite + Tailwind CSS Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: easymark-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - easymark-net

networks:
  easymark-net:
    driver: bridge
